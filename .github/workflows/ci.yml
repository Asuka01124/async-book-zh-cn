name: 中文书籍与示例检查

on:
  pull_request:
  push:
    branches:
      - codex/zh-cn
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup update stable && rustup default stable
      - name: Install mdbook
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: mdbook@0.5.4
      - run: mdbook build
      - name: 检查已完成章节正文与本地链接
        run: python3 scripts/check_chapters.py
      - name: 检查原有示例
        run: cargo test --workspace --manifest-path examples/Cargo.toml --target-dir target
      - name: 检查新版指南示例
        run: cargo test --locked --manifest-path examples/guide-tests/Cargo.toml --target-dir target/guide-tests
      - name: 检查新版示例格式
        run: cargo fmt --manifest-path examples/guide-tests/Cargo.toml --check
